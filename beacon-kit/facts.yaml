# Not published until the owner confirms each one (each is written on the website today and needs evidence or a decision).
confirm:
  - "Relationship to Dublin Landscaping (Bray, Co. Wicklow, trading since 2006 per its website): the site links to its website, Facebook and Instagram. Confirm it is the same business or owner. If so, add its phone (0861620729 / 01 4412200) and address here, which also settles the trading-identity item below. Note this site publishes romacsweeney@gmail.com while Dublin Landscaping publishes dublinlandscaping@gmail.com: which one should customers use?"
  - "Trading identity: the legal or trading name, postal address and, if a company, registration number. Irish and EU rules require a seller to show these on the site."
  - "Counts and track record: '1,480+ native saplings sown' (hero) and '20 years of Christmas tree deliveries' (footer)."
  - "Partnership and badge: 'Dublin City & County Native Woodland Initiative', 'delivered under civic partnership' and use of the Dublin City shield. Is there written permission or a partnership with Dublin City Council?"
  - "Certification: 'BATCH CERTIFIED 2024' and 'Sustainable Forestry Ireland'. Which body certified what, and is it current?"
  - "Planting site claims: 'Co. Wicklow protected reserve', 'rewilding corridor active through 2035', '100-year protective trust', '100% zero peat forestry', GPS coordinates on the certificate."
  - "Service claims: 'Dublin Metro free delivery', 'zero-emission drop-offs', deliveries starting the last week of November, 'Zero-Drop Guarantee', annual canopy growth reports, parchment certificate on recycled linen."
  - "Tree varieties: 'Nordmann Fir or Fraser Fir' and 'hand-cut' (what is actually sold this year)."
  - "Prices, stock, delivery areas and delivery dates: none are published on the site."
  - "Pictures: the hero and woodland pictures come from the design tool and are illustrative. Replace them with real photographs of the trees and the planting site. The 13 tree photos are Wikimedia Commons photos under CC licences, credited on credits.html; your own photographs of each tree would be better."
  - "Where the site lives: the GitHub Pages address is temporary. A beacon is read at the domain root (/.well-known/beacon.json), so registering it on the Digital Forum needs its own domain."
  - "Form service: reservations go through FormSubmit (free, no account). The owner must click the confirmation email FormSubmit sends on the first submission. FormSubmit publishes no operator, location or data-processing terms, so a GDPR data-processing agreement is not available: decide whether that is acceptable, or switch to a service that states one (the address is one line in docs/js/site.js)."
  - "Digital Forum registration: profile, attestation, verification token and feed URLs are issued by the Forum on registration; add them under profiles: then."
